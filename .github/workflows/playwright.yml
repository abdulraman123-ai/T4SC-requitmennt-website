name: T4SC Playwright smoke tests

on:
  push:
    branches:
      - qa/playwright-smoke-tests
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t4sc-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke-tests:
    name: Desktop and mobile browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Type-check project
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
          T4SC_PREVIEW_READ_ONLY: "true"
          NEXT_PUBLIC_T4SC_PREVIEW_READ_ONLY: "true"

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm test

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: t4sc-playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
